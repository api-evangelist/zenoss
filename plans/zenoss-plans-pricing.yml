description: >-
  Zenoss (now Virtana Service Observability) publishes no plans, tiers or prices. Every former Zenoss
  pricing entry point — zenoss.com/price and zenoss.com/product/how-to-buy — now 301s to
  https://www.virtana.com/service-observability/, and https://www.virtana.com/pricing returns 404.
  The only documented commercial paths are "Get a Demo" and "Contact Us". There is no self-serve
  signup, no free tier, no published API metering, and no per-request price anywhere on the product
  site or in the documentation. This artifact records that absence.

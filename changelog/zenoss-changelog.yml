entries:
  - date: '2026-05'
    breaking: false
    additions: false
    highlights:
      - >-
        Planned deprecation of the Collection Zone Maintenance Window feature postponed; existing CZ
        maintenance windows remain fully supported and an updated retirement timeline will follow.
  - date: '2026-04'
    breaking: false
    additions: true
    highlights:
      - >-
        Maintenance Windows gained a "Partially Completed" state, surfaced on the Activity and
        Timeline tabs, for windows that finished In Progress but could not be fully verified.
      - Maintenance Window Timeline added Day and Week views alongside Month.
      - Inventory sidebar reworked to a persistent Queries/Organizers panel.
      - Inventory added a "Previous filter" control to step back through applied filters one at a time.
      - Inventory column selection extended to all entity fields on new, saved and template views.
  - date: '2026-03'
    breaking: false
    additions: true
    highlights:
      - Smart View added an "Explore more" toolbar action linking to Container Observability, Inventory or CZ by entity type.
      - Inventory added a scheduled export feature that emails saved inventory views on a recurring schedule.
recent_window: 2026-03 through 2026-05 (most recent months published as of 2026-08-29)

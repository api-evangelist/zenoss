apis:
  - aid: zenoss:zenoss
    name: Virtana Service Observability API
    description: >-
      Versioned /v1 REST API for the Zenoss (Virtana Service Observability) platform. Covers the data
      receiver (metrics, events, entity models), event query and event management, model context
      (entity search, custom properties, maintenance windows), the metric/entity-field/event-field
      dictionary, notification Actions (triggers, rules, destinations), credentials, and user and
      group management. JSON over HTTPS, authenticated with a long-lived key in the zenoss-api-key
      header. Non-CRUD operations use Google AIP custom-method colon suffixes (:search, :count,
      :batchGet, :deleteBulk). Each tenant is assigned one of four regional endpoints — api.virtana.ai
      (Iowa), api2 (Las Vegas), api3 (Sydney), api4 (Frankfurt).
    humanURL: https://docs.zenoss.io/api/zenoss-api.html
    baseURL: https://api.virtana.ai
    tags:
      - AIOps
      - Monitoring
      - Observability
      - Event Management
      - Metrics
    properties:

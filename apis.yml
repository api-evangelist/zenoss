aid: zenoss
name: Zenoss
description: >-
  Zenoss is an AIOps and full-stack IT infrastructure monitoring platform, acquired by Virtana in May
  2025 and now sold as Virtana Service Observability. It ingests metrics, events and entity models
  from hybrid estates — VMware, Nutanix, Kubernetes, AWS, Azure, GCP, network and storage — through
  on-premises Collection Zones, streaming agents and OpenTelemetry/OTLP, then applies dependency
  mapping, event correlation and anomaly detection to turn raw signal into service impact. The
  developer surface is a versioned /v1 REST API covering data ingest, event query and management,
  entity/model context, maintenance windows, the metric dictionary, notification Actions, credentials
  and user management, plus first-party proto3/gRPC contracts for the data receiver and data registry.
  API clients authenticate with a long-lived key in the zenoss-api-key header, issued per API Client
  from the console, and each tenant is assigned one of four regional endpoints.

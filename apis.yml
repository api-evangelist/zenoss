  - aid: zenoss:zenoss-grpc
    name: Zenoss Cloud gRPC Services
    description: >-
      First-party proto3 service contracts published at github.com/zenoss/zenoss-protobufs and
      released as a Go module (v1.5.5, 2026-07-27). DataReceiverService carries unary PutEvents,
      PutMetrics and PutModels plus client-streaming PutEvent, PutMetric and PutModel;
      DataRegistryService registers metric and definition metadata; CredentialManagement reads stored
      credentials; CollectionConfigService streams collection configuration to probes. RPCs carry
      google.api.http annotations binding them to the same /v1 REST paths, so the protobufs are the
      machine-readable contract behind the ingest surface.
    humanURL: https://docs.zenoss.io/api/receiver/data-receiver.html
    baseURL: https://api.virtana.ai
    tags:
      - gRPC
      - Metrics
      - Event Management
      - OpenTelemetry
    properties:
      - type: Protobuf
        url: grpc/zenoss-data-receiver.proto
      - type: Protobuf
        url: grpc/zenoss-data-registry.proto
      - type: Protobuf
        url: grpc/zenoss-credentials.proto
      - type: Protobuf
        url: grpc/zenoss-collection-cfg.proto
      - type: SourceCode
        url: https://github.com/zenoss/zenoss-protobufs
      - type: Documentation
        url: https://docs.zenoss.io/api/receiver/data-receiver.html
  - aid: zenoss:zenoss-router-api
    name: Zenoss API for Collection Zone and Resource Manager
    description: >-
      The long-standing Zenoss JSON router API, still documented and supported for Zenoss Cloud
      Collection Zones and on-premises Zenoss Resource Manager / Service Dynamics. Every call is an
      HTTP POST of a JSON envelope — {"action": "<Router>", "method": "<method>", "data": [...],
      "tid": <n>} — to a router path under /zport/dmd (for example device_router, events_router,
      triggers_router). 61 routers are documented, covering devices, events, event classes, triggers,
      templates, reports, jobs, users, LDAP, SAML IdP, licensing, ZenPacks, impact and vendor-specific
      surfaces (AWS, Azure, vSphere, Hyper-V, OpenStack, Cisco UCS, EMC Isilon, SMI-S). Collection
      Zones authenticate with a z-api-key header; Resource Manager uses HTTP Basic. Zenoss states that
      some of this functionality will be replaced by the newer /v1 API services over time.
    humanURL: https://docs.zenoss.com/api/background.html
    baseURL: https://{collection-zone-host}/cz0/zport/dmd
    tags:
      - Monitoring
      - Event Management
      - Infrastructure
    properties:
      - type: Documentation
        url: https://docs.zenoss.com/api/background.html
